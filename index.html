<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Brazzaville</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header></header>
    <main>
        <section class="primary-mesure peu_nuageux">
            <h1 class="city-name">Brazzaville, <span class="country-name">Rép. du Congo</span></h1>
            <div class="temperature-container">
                <img src="images/peu_nuageux.png" alt="" class="time-icon">
                <div class="temperature">
                    <h2>25.1°<span class="temperature-unit">c</span></h2>
                    <p class="description">
                        Belle journée ensoleillée
                    </p>
                </div>
            </div>
        </section>
        <section class="secondary-mesures">
            <div class="mesure-card">
                <img src="images/vent.png" alt="" class="secondary-icon">
                <h3>2.3 km/h</h3>
                <p>Vitesse du vent</p>
            </div>
            <div class="mesure-card">
                <img src="images/humidite.png" alt="" class="secondary-icon">
                <h3>72%</h3>
                <p>Humidité</p>
            </div>
            <div class="mesure-card">
                <img src="images/du-froid.png" alt="" class="secondary-icon">
                <h3>28.5 °C</h3>
                <p>Ressenti</p>
            </div>
            <div class="mesure-card">
                <img src="images/resilience-climatique.png" alt="" class="secondary-icon">
                <h3>Soleil</h3>
            </div>
        </section>
    </main>
    <footer>
        <p>Projet académique réalisé par <a href="">Gédéon KEDI</a> à Akieni Academy</p>
    </footer>
    <script src="meteo.js"></script>
</body>

</html>
